---
kubelet_config_enabled: true
kubelet_config_shutdown_grace_period: "30s"
kubelet_config_shutdown_grace_period_critical_pods: "10s"

k3s_location: "/var/lib/rancher/k3s"
bin_dir: "/usr/local/bin"
systemd_dir: "/etc/systemd/system"

api_port: 6443

k3s_agent_role_name: compute
k3s_gpu_nvidia_enabled: false
k3s_gvisor_enabled: true
k3s_server_longhorn_enabled: true
k3s_agent_longhorn_enabled: true

# Shared by the prereq role (installs the runtime), the k3s_agent role (wires it into
# containerd and labels the node) and the bootstrap role (RuntimeClass)
gvisor_runtime_name: runsc
gvisor_node_label: datahub.local/gvisor

enable_service_monitors: false

drain_nodes: false
