---
- name: Update apt repo and cache on all Debian/Ubuntu boxes
  apt: update_cache=yes force_apt_get=yes cache_valid_time=3600
  when: ansible_os_family == 'Debian'

- ansible.builtin.set_fact:
    required_packages: "{{ base_packages + extra_packages }}"

- name: Install base packages
  block:
    - name: Install base packages on debian servers
      apt: name={{ item }} state=latest
      when: ansible_os_family == 'Debian'
      with_items: "{{ required_packages }}"

    - name: Install base packages on arch servers
      pacman: name={{ item }} state=latest
      when: ansible_os_family == 'Archlinux'
      with_items: "{{ required_packages }}"

    - name: Install base packages on redhat servers
      yum: name={{ item }} state=latest
      when: ansible_os_family == 'RedHat'
      with_items: "{{ required_packages }}"

- name: Update packages
  block:
    - name: Upgrade all packages on debian servers
      apt: upgrade=yes force_apt_get=yes
      when: ansible_os_family == 'Debian' and os_upgrade

    - name: Upgrade all packages on arch servers
      pacman: update_cache=yes upgrade=yes
      when: ansible_os_family == 'Archlinux' and os_upgrade

    - name: Upgrade all packages on redhat servers
      yum: name=* state=latest
      when: ansible_os_family == 'RedHat' and os_upgrade

- name: Check if a reboot is needed on all servers
  register: reboot_required_file
  stat:
    path: /var/run/reboot-required

- name: Reboot the box if kernel updated
  reboot:
    msg: "Reboot initiated by Ansible for kernel updates"
    connect_timeout: 5
    reboot_timeout: 90
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
  when: reboot_required_file.stat.exists

# OS config
- name: Modify remote hosts file
  become: true
  lineinfile:
    dest: /etc/hosts
    regexp: ".*{{ item }}$"
    line: "{{ hostvars[item].external_host | default(hostvars[item].ansible_host) }} {{ item }}"
    state: present
  when: hostvars[item].inventory_hostname is defined
  with_items: "{{ groups['k3s_cluster'] }}"

- name: Modify local hosts file
  lineinfile:
    dest: "{{ etc_hosts_file }}"
    regexp: ".* {{ item }}$"
    line: "{{ hostvars[item].external_host | default(hostvars[item].ansible_host) }} {{ item }}"
    create: true
    state: present
  delegate_to: 127.0.0.1
  when: hostvars[item].inventory_hostname is defined
  with_items: "{{ groups['k3s_cluster'] }}"

- name: Set timezone to UTC
  become: true
  community.general.timezone:
    name: "Etc/UTC"

- name: Wipe extra volumes
  become: true
  community.general.filesystem:
    dev: "/dev/{{ item.value.id }}"
    fstype: "{{ item.value.fstype | default('ext4') }}"
  with_items: "{{ extra_volumes | dict2items }}"
  when: "wipe_data"

- name: Ensure extra volumes directory
  file:
    path: "{{ item.value.path }}"
    state: directory
  with_items: "{{ extra_volumes | dict2items }}"

- name: Mount extra volumes
  become: true
  mount:
    path: "{{ item.value.path }}"
    src: "/dev/{{ item.value.id }}"
    fstype: "{{ item.value.fstype | default('ext4') }}"
    opts: "{{ item.value.opts | default('defaults,nofail') }}"
    state: mounted
  with_items: "{{ extra_volumes | dict2items }}"

- name: Empty required directories
  become: true
  file:
    path: "{{ item }}"
    state: absent
  with_items: "{{ required_directories }}"
  when: "wipe_data"

- name: Create required directories
  become: true
  file:
    path: "{{ item }}"
    state: directory
  with_items: "{{ required_directories }}"

- name: Install NVIDIA packages
  block:
    - name: Install NVIDIA packages on debian servers
      become: true
      when: ansible_os_family == 'Debian'
      block:
        # The container toolkit is only the runtime shim: nvidia-ctk needs the
        # driver itself (libnvidia-ml.so.1) to generate the CDI spec.
        - name: Enable contrib and non-free components
          ansible.builtin.apt_repository:
            repo: >-
              deb {{ nvidia_debian_repo_url }} {{ ansible_distribution_release }}
              {{ nvidia_debian_repo_components }}
            filename: nvidia-contrib-non-free
            state: present
            update_cache: true

        - name: Install NVIDIA driver
          ansible.builtin.apt:
            name: "{{ nvidia_driver_packages }}"
            state: present
          register: nvidia_driver

        # The kernel module is only loaded after a reboot, and nvidia-ctk
        # needs it to be loaded to enumerate the devices.
        - name: Reboot to load the NVIDIA kernel module
          when: nvidia_driver.changed
          ansible.builtin.reboot:
            msg: "Reboot initiated by Ansible to load the NVIDIA kernel module"
            connect_timeout: 5
            reboot_timeout: 900
            pre_reboot_delay: 0
            post_reboot_delay: 30
            test_command: uptime

        - name: Check that the NVIDIA driver is loaded
          ansible.builtin.command:
            cmd: nvidia-smi -L
          register: nvidia_smi
          changed_when: false
          failed_when: false

        # With Secure Boot on, the DKMS module builds but the kernel refuses to
        # insert it until its MOK is enrolled, which needs the physical console.
        - name: Fail if the NVIDIA kernel module could not be loaded
          when: nvidia_smi.rc != 0
          ansible.builtin.fail:
            msg: >-
              The NVIDIA kernel module is not loaded.
              If 'mokutil --sb-state' reports Secure Boot enabled, run
              'mokutil --import /var/lib/dkms/mok.pub' on the node and complete the
              enrollment from the physical console on the next boot, or disable
              Secure Boot in the firmware.

        # The keyring must exist before the repo is enabled, otherwise every
        # later apt run fails with "the repository is not signed".
        - name: Add NVIDIA container toolkit keyring
          ansible.builtin.shell: |
            set -o pipefail
            curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | \
              gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
          args:
            executable: /bin/bash
            creates: /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg

        - name: Add NVIDIA container toolkit repository
          ansible.builtin.shell: |
            set -o pipefail
            curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | \
              sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g' \
              > /etc/apt/sources.list.d/nvidia-container-toolkit.list
          args:
            executable: /bin/bash
          changed_when: true

        - name: Install nvidia-container-toolkit
          ansible.builtin.apt:
            name: nvidia-container-toolkit
            state: present
            update_cache: true
    - name: Install NVIDIA packages on arch servers
      become: true
      ansible.builtin.shell: |
        pacman -Qi nvidia-container-toolkit >/dev/null 2>&1 || pacman -S --noconfirm nvidia-container-toolkit
      when: ansible_os_family == 'Archlinux'
    - name: Install NVIDIA packages on redhat servers
      become: true
      ansible.builtin.shell: |
        rpm -q nvidia-container-toolkit || curl -s -L https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo | \
          tee /etc/yum.repos.d/nvidia-container-toolkit.repo \
          && yum install -y nvidia-container-toolkit
      when: ansible_os_family == 'RedHat'

    - name: Generate a CDI specification
      become: true
      ansible.builtin.shell: |
        nvidia-ctk runtime configure --runtime=containerd
        nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
  when: k3s_gpu_nvidia_enabled

- name: Prune Images
  become: true
  block:
    - ansible.builtin.file:
        path: "/var/log/k3s-prune-images/"
        mode: 0755
        state: directory
    - ansible.builtin.cron:
        name: "k3s-prune-images"
        hour: "0"
        minute: "0"
        job: "{{ bin_dir }}/k3s crictl rmi --prune | multilog t s1048576 n5 '!tai64nlocal' /var/log/k3s-prune-images/ 2>&1"
