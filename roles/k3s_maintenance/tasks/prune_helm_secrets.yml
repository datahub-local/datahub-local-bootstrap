---
# Helm stores every release revision as a secret of ~1MB (traefik, argo-cd),
# which dominates the secrets keyspace and slows every cluster-wide secrets
# LIST. Keep only the newest revisions of each release and delete the rest.
- name: Prune old Helm release-history secrets
  ansible.builtin.shell: |
    set -o pipefail
    {{ bin_dir }}/k3s kubectl get secrets --all-namespaces -l owner=helm --no-headers \
      -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name' \
      | awk '{ rel = $2; sub(/\.v[0-9]+$/, "", rel); ver = $2; sub(/^.*\.v/, "", ver); print $1, rel, ver + 0, $2 }' \
      | sort -k1,1 -k2,2 -k3,3nr \
      | awk -v keep={{ k3s_maintenance_helm_history_keep }} '
          { key = $1 " " $2 }
          key == prev { count++ }
          key != prev { count = 1; prev = key }
          count > keep { print $1, $4 }' \
      | while read -r ns name; do
          {{ bin_dir }}/k3s kubectl --namespace "$ns" delete secret "$name"
        done
  args:
    executable: /bin/bash
  register: k3s_maintenance_prune_result
  retries: 3
  delay: 10
  until: k3s_maintenance_prune_result.rc == 0
  changed_when: k3s_maintenance_prune_result.stdout | length > 0

- name: Report pruned Helm secrets
  ansible.builtin.debug:
    msg: "{{ k3s_maintenance_prune_result.stdout_lines | default(['No Helm release-history secrets to prune']) }}"
