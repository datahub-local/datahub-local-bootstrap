---
# The prune lives in one file, installed here and run by both this task and the daily
# timer. An inline copy would be a second implementation that drifts from the one the
# node actually runs on its schedule.
- name: Install the Helm-secret prune script
  ansible.builtin.template:
    src: prune-helm-secrets.sh.j2
    dest: "{{ bin_dir }}/k3s-prune-helm-secrets"
    owner: root
    group: root
    mode: "0755"

- name: Prune old Helm release-history secrets
  ansible.builtin.command:
    cmd: "{{ bin_dir }}/k3s-prune-helm-secrets"
  register: k3s_maintenance_prune_result
  retries: 3
  delay: 10
  until: k3s_maintenance_prune_result.rc == 0
  changed_when: k3s_maintenance_prune_result.stdout | length > 0

- name: Report pruned Helm secrets
  ansible.builtin.debug:
    msg: "{{ k3s_maintenance_prune_result.stdout_lines | default(['No Helm release-history secrets to prune']) }}"
