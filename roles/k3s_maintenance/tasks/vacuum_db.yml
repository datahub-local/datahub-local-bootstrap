---
- name: Check for kine sqlite datastore
  ansible.builtin.stat:
    path: "{{ k3s_maintenance_db_path }}"
  register: k3s_maintenance_db

- name: Vacuum kine sqlite datastore and truncate WAL
  when: k3s_maintenance_db.stat.exists
  block:
    - name: Get service facts
      ansible.builtin.service_facts:

    - name: Assert K3s server is stopped
      ansible.builtin.assert:
        that: >-
          (ansible_facts.services['k3s.service'] | default({'state': 'stopped'})).state != 'running'
        fail_msg: "K3s must be stopped before vacuuming the datastore"

    - name: Get datastore size before vacuum
      ansible.builtin.shell:
        cmd: "du -h {{ k3s_maintenance_db_path }}*"
      register: k3s_maintenance_size_before
      changed_when: false

    - name: Vacuum datastore and truncate WAL
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import sqlite3
            conn = sqlite3.connect("{{ k3s_maintenance_db_path }}", timeout=60)
            conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
            conn.execute("VACUUM")
            conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
            conn.close()
      changed_when: true

    - name: Get datastore size after vacuum
      ansible.builtin.shell:
        cmd: "du -h {{ k3s_maintenance_db_path }}*"
      register: k3s_maintenance_size_after
      changed_when: false

    - name: Report vacuum result
      ansible.builtin.debug:
        msg:
          - "Before: {{ k3s_maintenance_size_before.stdout_lines }}"
          - "After: {{ k3s_maintenance_size_after.stdout_lines }}"
