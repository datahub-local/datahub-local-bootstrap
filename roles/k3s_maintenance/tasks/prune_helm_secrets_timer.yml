---
# One server is enough, and the server group holds that one host: pruning goes through the
# API server, so a timer on an agent would do the same work with no benefit, and a timer on
# every server would race itself.
- name: Install the daily Helm-secret prune schedule
  when: inventory_hostname == groups['server'][0]
  tags: prune-install
  block:
    - name: Install the prune service unit
      ansible.builtin.template:
        src: prune-helm-secrets.service.j2
        dest: "{{ systemd_dir }}/k3s-prune-helm-secrets.service"
        owner: root
        group: root
        mode: "0644"

    - name: Install the prune timer unit
      ansible.builtin.template:
        src: prune-helm-secrets.timer.j2
        dest: "{{ systemd_dir }}/k3s-prune-helm-secrets.timer"
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start the prune timer
      ansible.builtin.systemd:
        name: k3s-prune-helm-secrets.timer
        enabled: true
        state: started
        daemon_reload: true
