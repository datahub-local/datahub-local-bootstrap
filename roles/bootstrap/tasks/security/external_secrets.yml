---
- name: External Secrets - Install chart
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    chart_version: "{{ helm_chart_version['external-secrets']['version'] }}"
    create_namespace: true
    force: "{{ helm_force_update }}"
    release_namespace: security
    values: "{{ external_secrets_helm_values }}"
    context: "{{ k3s_context_name }}"
