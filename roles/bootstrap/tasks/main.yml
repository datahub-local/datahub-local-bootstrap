---
# - name: Display all variables/facts known for a host
#   tags: always
#   debug:
#     msg: "{{ traefik_helm_values }}"

# - fail:
#   tags: always

- name: K8s - Set context
  tags: always
  ansible.builtin.shell: |
    kubectl config use-context {{ k3s_context_name }}
  changed_when: true

- name: Install Helm repositories
  tags: always
  kubernetes.core.helm_repository:
    name: "{{ item.value.ref.split('/')[0] }}"
    repo_url: "{{ item.value.repository }}"
    force_update: true
  with_items: "{{ helm_chart_version | dict2items }}"

# The installation order below is significant, do not reshuffle it:
# cert-manager issues the wildcard certificate reflected by kubernetes-reflector and
# consumed by the Traefik gateway, so it has to be in place before the ingress layer.
# Everything else is layered on top of that ingress/security baseline.

- name: cert-manager
  ansible.builtin.import_tasks: security/cert_manager.yml
  tags: only-cert-manager

- name: external-dns
  ansible.builtin.import_tasks: networking/external_dns.yml
  tags: only-external-dns

- name: kubernetes-reflector
  ansible.builtin.import_tasks: other/kubernetes_reflector.yml
  tags: only-kubernetes-reflector

- name: kubernetes-reloader
  ansible.builtin.import_tasks: other/kubernetes_reloader.yml
  tags: only-kubernetes-reloader

- name: traefik
  ansible.builtin.import_tasks: networking/traefik.yml
  tags: only-traefik

- name: security
  ansible.builtin.import_tasks: security/authentication.yml
  tags: only-security
  when: "security_enabled"

- name: external-secrets
  ansible.builtin.import_tasks: security/external_secrets.yml
  tags: only-external-secrets
  when: "external_secrets_enabled"

- name: gvisor
  ansible.builtin.import_tasks: security/gvisor.yml
  tags: only-gvisor
  when: "gvisor_enabled"

- name: agent-sandbox
  ansible.builtin.import_tasks: security/agent_sandbox.yml
  tags: only-agent-sandbox
  when: "agent_sandbox_enabled"

- name: longhorn
  ansible.builtin.import_tasks: storage/longhorn.yml
  tags: only-longhorn
  when: "longhorn_enabled"

- name: nfs-external-provisioner
  ansible.builtin.import_tasks: storage/nfs_external_provisioner.yml
  tags: only-nfs-subdir-external-provisioner
  when: "nfs_external_provisioner_enabled"

- name: argocd
  ansible.builtin.import_tasks: other/argocd.yml
  tags: only-argocd
  when: "argocd_enabled"

- name: nvidia-k8s-device-plugin
  ansible.builtin.import_tasks: other/nvidia_device_plugin.yml
  tags: only-nvidia-k8s-device-plugin
  when: "k8s_device_plugin_enabled"
