---
# with_fileglob doesn't work with remote_src, it tries to find the file on the
# local control-plane instead of the remote host. Shell supports wildcards.
- name: Save current K3s service
  ansible.builtin.shell:
    cmd: "cp {{ systemd_dir }}/k3s*.service /tmp/"
  changed_when: true

- name: Install new K3s Version
  ansible.builtin.command:
    cmd: "{{ bin_dir }}/k3s-install.sh"
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_BIN_DIR: "{{ bin_dir }}"
    INSTALL_K3S_SKIP_ENABLE: "true"
    INSTALL_K3S_SKIP_START: "true"
    INSTALL_K3S_EXEC: "{{ 'server' if 'server' in group_names else 'agent' }}"
  changed_when: true

- name: Restore K3s service
  ansible.builtin.shell:
    cmd: "mv /tmp/k3s*.service {{ systemd_dir }}/"
  changed_when: true

# The server has to be restarted anyway to apply the new version, so take
# advantage of the stop window to run the datastore maintenance
- name: Stop K3s service for maintenance [server]
  ansible.builtin.systemd:
    state: stopped
    name: k3s
  when: "k3s_upgrade_maintenance_enabled and 'server' in group_names"

- name: Run K3s maintenance while the server is stopped [server]
  ansible.builtin.include_role:
    name: k3s_maintenance
  vars:
    k3s_maintenance_prune_helm_secrets: false
  when: "k3s_upgrade_maintenance_enabled and 'server' in group_names"

- name: Restart K3s service [server]
  ansible.builtin.systemd:
    state: restarted
    daemon_reload: true
    enabled: true
    name: k3s
  when: "'server' in group_names"

- name: Restart K3s service [agent]
  ansible.builtin.systemd:
    state: restarted
    daemon_reload: true
    enabled: true
    name: k3s-agent
  when: "'agent' in group_names"
