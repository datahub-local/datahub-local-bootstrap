---
- name: Cluster prep
  hosts: k3s_cluster
  gather_facts: true
  become: true
  tasks:
    - name: Include prereq role
      include_role:
        name: prereq
    - name: Include airgap role
      include_role:
        name: airgap
    - name: Include raspberrypi role
      include_role:
        name: raspberrypi

- name: Setup K3S server
  hosts: server
  become: true
  roles:
    - role: k3s_server

- name: Setup K3S agent
  hosts:
    - agent
  become: true
  roles:
    - role: k3s_agent
